name: CD production

# Merge to main builds, then waits for manual approval before deploying to production.
# The approval gate is the GitHub environment "production" with a required reviewer.
#
# Two deviations from the project plan, both recorded in docs/decisions.md:
#  - D-002: B1 Basic has no deployment slots, so there is no staging slot and no swap.
#           Production is a second App Service on the same plan. In the final week the
#           plan can be scaled to S1 and a real slot swap added.
#  - D-004: the ADvTECH tenant blocks student app registrations, so deployment uses a
#           publish profile stored as an encrypted GitHub secret rather than OIDC.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Skips cleanly until the Azure resources exist and the variable is set.
    if: vars.AZURE_API_APP_PROD != ''
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
        continue-on-error: true

      - name: Build SPA
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publish API
        run: dotnet publish api/src/Carbonate.Api/Carbonate.Api.csproj -c Release -o publish

      - name: Copy SPA into wwwroot
        if: hashFiles('web/package.json') != ''
        run: |
          mkdir -p publish/wwwroot
          cp -r web/dist/* publish/wwwroot/

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: carbonate-app
          path: publish

  production:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    # This environment has a required reviewer configured in repository settings, so
    # the job pauses here until a human approves. Nothing reaches production unreviewed.
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: carbonate-app
          path: publish

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_PROD }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: publish

      - name: Smoke test
        run: |
          set -e
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.PROD_URL }}/health" || true)
            if [ "$code" = "200" ]; then echo "Production healthy."; exit 0; fi
            echo "Attempt $i returned $code - retrying in 10s"
            sleep 10
          done
          echo "::error::Production health check failed"
          exit 1
