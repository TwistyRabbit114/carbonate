# Local development dependencies: SQL Server and the Blob Storage emulator.
# Start with:  docker compose up -d
# Stop with:   docker compose down          (add -v to wipe the data)
#
# On Apple Silicon, SQL Server runs under Rosetta - set
# DOCKER_DEFAULT_PLATFORM=linux/amd64 before bringing it up.

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: carbonate-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Only_1!"   # local container only, never used in Azure
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Windows reserves parts of the 9914-10213 range for Hyper-V, so Azurite's
  # default host ports are often unbindable ("bind: An attempt was made to access
  # a socket in a way forbidden by its access permissions"). The container keeps
  # the standard ports; only the host side is moved. Check your own machine with:
  #   netsh interface ipv4 show excludedportrange protocol=tcp
  #
  # Only blob is used by the application. Queue and table are published for
  # convenience when inspecting the emulator.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: carbonate-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data
    ports:
      - "10010:10000"   # blob   - the only one the API uses
      - "10011:10001"   # queue
      - "10012:10002"   # table
    volumes:
      - azuritedata:/data

volumes:
  sqldata:
  azuritedata:
