name: CD dev

# Merge to dev builds the SPA into the API's wwwroot, deploys the single unit to the
# dev App Service, then smoke-tests /health.
#
# Deployment uses an App Service publish profile stored as an encrypted GitHub secret.
# The project plan specifies OIDC federated credentials, but the ADvTECH tenant denies
# students access to Microsoft Entra ID, so app registrations cannot be created.
# See docs/decisions.md D-004.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24.x'

jobs:
  deploy:
    name: Build and deploy to dev
    runs-on: ubuntu-latest
    # Skips cleanly (grey, not red) until the Azure resources exist and the
    # repository variable AZURE_API_APP_DEV is set.
    if: vars.AZURE_API_APP_DEV != ''
    environment:
      name: dev
      url: ${{ vars.DEV_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
        continue-on-error: true

      # The SPA is served from the API's wwwroot (hosting option 3 in the plan), so it
      # is built first and copied into the publish output. One deploy unit, same origin,
      # no CORS, and the SameSite=Strict refresh cookie works.
      # Skipped while web/ does not exist yet.
      - name: Build SPA
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publish API
        run: dotnet publish api/src/Carbonate.Api/Carbonate.Api.csproj -c Release -o publish

      - name: Copy SPA into wwwroot
        if: hashFiles('web/package.json') != ''
        run: |
          mkdir -p publish/wwwroot
          cp -r web/dist/* publish/wwwroot/

      - name: Deploy to the dev app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_DEV }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
          package: publish

      # Six minutes, not two. A cold start on B1 is slow on its own, and the startup seeder
      # waits on a serverless database that may be auto-paused — together that can exceed
      # two minutes, which failed a deploy that was actually fine (run #21).
      - name: Smoke test
        run: |
          set -e
          echo "Waiting for ${{ vars.DEV_URL }}/health ..."
          for i in $(seq 1 36); do
            code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "${{ vars.DEV_URL }}/health" || echo "000")
            case "$code" in
              200)
                echo "Health check passed after $(( i * 10 ))s."
                exit 0
                ;;
              000|403|502|503)
                # Still starting, or the platform is still swapping the site over.
                echo "Attempt $i: $code (starting) - retrying in 10s"
                ;;
              *)
                # A real response from a running app that is unhealthy. Still retried, in case
                # it is the first request losing a race with the seeder, but called out.
                echo "Attempt $i: $code (app responded but is not healthy) - retrying in 10s"
                ;;
            esac
            sleep 10
          done
          echo "::error::/health never returned 200 within six minutes"
          exit 1
