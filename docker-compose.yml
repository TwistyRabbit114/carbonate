# Local development dependencies: SQL Server and the Blob Storage emulator.
# Start with:  docker compose up -d
# Stop with:   docker compose down          (add -v to wipe the data)
#
# On Apple Silicon, SQL Server runs under Rosetta - set
# DOCKER_DEFAULT_PLATFORM=linux/amd64 before bringing it up.

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: carbonate-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Only_1!"   # local container only, never used in Azure
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: carbonate-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data
    ports:
      - "10000:10000"   # blob
      - "10001:10001"   # queue
      - "10002:10002"   # table
    volumes:
      - azuritedata:/data

volumes:
  sqldata:
  azuritedata:
