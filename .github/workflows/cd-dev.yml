name: CD dev

# Merge to dev deploys the dev environment, then smoke-tests it.
# Azure auth is OIDC federated credentials - no publish profiles, no secrets in the repo.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # required for azure/login OIDC

concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24.x'

jobs:
  deploy:
    name: Build and deploy to dev
    runs-on: ubuntu-latest
    # Skips cleanly (grey, not red) until the Azure resources exist and the
    # repository variable is set. Remove nothing - just set AZURE_API_APP_DEV
    # under Settings > Secrets and variables > Actions > Variables.
    if: vars.AZURE_API_APP_DEV != ''
    environment:
      name: dev
      url: ${{ vars.DEV_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The SPA is served from the API's wwwroot (hosting option 3), so it is built
      # first and copied into the publish output. One deploy unit, same origin,
      # no CORS, and the SameSite=Strict refresh cookie works.
      - name: Build SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publish API
        run: dotnet publish api/src/Carbonate.Api/Carbonate.Api.csproj -c Release -o publish

      - name: Copy SPA into wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r web/dist/* publish/wwwroot/

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to the dev app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_DEV }}
          package: publish

      - name: Smoke test
        run: |
          set -e
          echo "Waiting for the app to come up..."
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.DEV_URL }}/health" || true)
            if [ "$code" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i returned $code - retrying in 10s"
            sleep 10
          done
          echo "::error::Health check never returned 200"
          exit 1

      - name: Sign out of Azure
        if: always()
        run: az logout || true
